<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ACES Membership Card</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #08060f;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =========================
           CARD
        ========================== */

        .id-card {
            position: relative;

            /* Standard Card Ratio (2:3) matching 1024x1536 background asset */
            width: 375px;
            aspect-ratio: 2 / 3;

            overflow: hidden;
            border-radius: 22px;
            border: 1.5px solid rgba(168, 85, 247, 0.45);

            background-color: #08060f;
            background-image: url("{{BG_IMAGE}}");
            background-size: cover;
            background-position: center;

            color: white;

            box-shadow:
                0 0 20px rgba(145, 60, 255, 0.35),
                0 0 60px rgba(100, 30, 255, 0.15);
        }

        /* =========================
           CONTENT CONTAINER
        ========================== */

        .card-content {
            position: relative;
            z-index: 2;

            width: 100%;
            height: 100%;

            padding: 38px 28px 30px;

            display: flex;
            flex-direction: column;
        }

        /* =========================
           HEADER
        ========================== */

        .card-header {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
            filter: invert(1) brightness(1.2);
            mix-blend-mode: screen;
        }

        .header-divider {
            width: 1px;
            height: 40px;
            background: rgba(190, 130, 255, 0.5);
        }

        .brand {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .brand-name {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 2px;
            line-height: 1;

            background: linear-gradient(
                180deg,
                #ffffff 20%,
                #b879ff 100%
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            font-size: 7px;
            letter-spacing: 1.6px;
            line-height: 1.3;
            color: #d8c9ec;
            white-space: nowrap;
        }

        /* =========================
           TAGLINE
        ========================== */

        .tagline {
            margin-top: 24px;

            text-align: center;

            font-size: 9px;
            letter-spacing: 3px;

            color: #c47aff;
        }

        /* =========================
           MEMBER SECTION
        ========================== */

        .member-section {
            margin-top: 90px;

            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .member-divider-top {
            width: 45px;
            height: 2px;

            margin-bottom: 16px;

            border-radius: 10px;

            background: #a855f7;

            box-shadow:
                0 0 8px #8b35ff;
        }

        .member-name {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2px;
            line-height: 1.25;

            text-transform: uppercase;
            max-width: 100%;
            word-wrap: break-word;

            text-shadow:
                0 0 12px rgba(255, 255, 255, 0.15);
        }

        .member-divider {
            width: 55px;
            height: 3px;

            margin-top: 16px;

            border-radius: 10px;

            background: #a855f7;

            box-shadow:
                0 0 10px #8b35ff;
        }

        /* =========================
           MEMBERSHIP INFORMATION
        ========================== */

        .membership-info {
            margin-top: 40px;

            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .info-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;

            align-items: center;

            column-gap: 15px;
        }

        .info-label {
            color: #bdb2d0;

            font-size: 9px;
            letter-spacing: 1.8px;

            text-transform: uppercase;
            text-align: right;
        }

        .info-divider {
            width: 1px;
            height: 24px;

            background: rgba(190, 130, 255, 0.7);
        }

        .info-value {
            color: #ffffff;

            font-size: 14px;
            font-weight: 600;

            letter-spacing: 1px;

            text-align: left;
        }

        /* =========================
           FOOTER
        ========================== */

        .card-footer {
            margin-top: auto;

            width: 135px;
        }

        .footer-text {
            color: #bd7cff;

            font-size: 9px;
            line-height: 1.8;

            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 500px) {
            .id-card {
                width: 90vw;
            }
        }
    </style>
</head>

<body>

    <div class="id-card">

        <div class="card-content">

            <!-- HEADER -->
            <header class="card-header">

                <img
                    class="logo"
                    src="{{LOGO_IMAGE}}"
                    alt="ACES Logo"
                >

                <div class="header-divider"></div>

                <div class="brand">
                    <div class="brand-name">
                        ACES
                    </div>

                    <div class="brand-subtitle">
                        ASSOCIATION OF COMPUTER<br>
                        ENGINEERING STUDENTS
                    </div>
                </div>

            </header>


            <!-- TAGLINE -->
            <div class="tagline">
                CONNECT&nbsp;&nbsp;·&nbsp;&nbsp;INNOVATE&nbsp;&nbsp;·&nbsp;&nbsp;INSPIRE
            </div>


            <!-- MEMBER -->
            <section class="member-section">

                <div class="member-divider-top"></div>

                <h1 class="member-name">
                    {{MEMBER_NAME}}
                </h1>

                <div class="member-divider"></div>

            </section>


            <!-- MEMBERSHIP DATA -->
            <section class="membership-info">

                <div class="info-row">

                    <span class="info-label">
                        Membership No.
                    </span>

                    <span class="info-divider"></span>

                    <span class="info-value">
                        {{MEMBERSHIP_NO}}
                    </span>

                </div>


                <div class="info-row">

                    <span class="info-label">
                        Valid Upto
                    </span>

                    <span class="info-divider"></span>

                    <span class="info-value">
                        {{VALID_UPTO}}
                    </span>

                </div>

            </section>


            <!-- FOOTER -->
            <footer class="card-footer">

                <div class="footer-text">
                    BUILDING<br>
                    BRIGHTER<br>
                    TOMORROW,<br>
                    TOGETHER
                </div>

            </footer>

        </div>

    </div>

</body>
</html>
